<style>
:root{--bg:#080808;--panel:#121212;--panel2:#1c1c1c;--line:#232323;--line2:#333;--ink:#fff;--mute:#9a9a9a;--dim:#5f5f5f;
--sans:Geist,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}

/* Nav */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:2px;padding:12px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
nav a{color:var(--mute);text-decoration:none;padding:6px 14px;font-size:14px;font-weight:500;border-radius:6px;transition:color .15s}
nav a:hover{color:#fff}
nav a.on{color:#fff;background:var(--panel2)}
nav a.navbtn{margin-left:10px;background:#5865F2;color:#fff;font-weight:600;white-space:nowrap}
nav a.navbtn:hover{background:#4752C4}
.navsoc{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
nav .navsoc a{display:grid;place-items:center;padding:7px}
.navsoc svg,.fsoc svg{width:18px;height:18px;display:block}
.navsoc img,.fsoc img{height:18px;width:auto;display:block;opacity:.75;transition:opacity .15s}
.navsoc a:hover img,.fsoc a:hover img{opacity:1}
.fsoc{display:none}
footer a.staff{color:inherit;text-decoration:none}
footer a.staff:hover{color:#fff}
.fsoc a{display:grid;place-items:center;padding:8px;color:var(--mute)}
@media(max-width:960px){.navsoc{position:static;transform:none;margin-left:8px}}
@media(max-width:760px){nav .navlogo,nav .long{display:none}nav a{white-space:nowrap;padding:6px 10px}}
.navlogo{height:22px;width:auto;display:block;margin-right:12px}
@media(max-width:600px){nav{gap:0;padding:10px 4px;justify-content:safe center;overflow-x:auto}nav a{padding:6px 7px;font-size:13px;white-space:nowrap}nav .navlogo,nav .long,.navsoc{display:none}.fsoc{display:flex;justify-content:center;gap:8px;margin:-12px 0 14px}nav a.navbtn{margin-left:4px}}

/* Page title */
.phero{max-width:1080px;margin:0 auto;padding:64px 20px 0}
.phero h1{margin:0;font:600 clamp(36px,6vw,56px)/1.05 var(--sans);letter-spacing:-.04em}
.phero p{margin:14px 0 0;font:500 12px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
main{max-width:1080px;margin:0 auto;padding:8px 20px 72px}

/* Section headers, labels, shared bits */
.sec{margin-top:56px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.sech h2{margin:0;font:600 clamp(22px,3vw,28px)/1.1 var(--sans);letter-spacing:-.03em}
.sech small{font:500 12px/1 var(--mono);color:var(--mute);letter-spacing:.06em}
.mlab{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.rk{flex:none;display:inline-grid;place-items:center;min-width:22px;font:500 13px/1 var(--mono);color:var(--dim)}
.rk.m1{color:#fff}
.msg{padding:28px 0;color:var(--mute);font-size:14px}
.ghost{background:none;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:8px 16px;font:500 13px/1.2 var(--sans);cursor:pointer;transition:border-color .15s}
.ghost:hover{border-color:#fff}

footer{text-align:center;padding:28px 20px;color:var(--dim);font:12px/1 var(--mono);letter-spacing:.04em;border-top:1px solid var(--line)}

/* One quiet entrance for the page */
@keyframes fade{from{opacity:0}to{opacity:1}}
.phero,main{animation:fade .6s ease both}
main{animation-delay:.1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Members table */
.tools{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.tools h2{margin:0;font:600 clamp(22px,3vw,28px)/1.1 var(--sans);letter-spacing:-.03em}
.filters{flex:1;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pick{background:var(--bg);border:1px solid var(--line2);color:#fff;border-radius:6px;padding:8px 10px;font:14px/1.3 var(--sans);cursor:pointer}
.pick:focus{outline:none;border-color:#fff}
.search{flex:1;min-width:180px;max-width:300px;background:none;border:1px solid var(--line2);color:#fff;border-radius:6px;padding:8px 12px;font:14px/1.3 var(--sans)}
.search::placeholder{color:var(--dim)}
.search:focus{outline:none;border-color:#fff}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{padding-top:16px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);cursor:pointer;user-select:none}
th:first-child{cursor:default}
th:hover,th.on{color:#fff}
th.on::after{content:" \2193"}
th.on.asc::after{content:" \2191"}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td:nth-child(2){font-family:var(--sans)}
tbody tr:hover td{background:#0f0f0f}
td.n{color:var(--dim);width:1%}
td a{color:#fff;text-decoration:none;font-weight:600}
td a:hover{text-decoration:underline;text-underline-offset:4px}
.player{display:flex;align-items:center;gap:10px}
.player img{flex:none;width:18px;height:18px;display:block}
td.msg{padding:36px 0;text-align:center;color:var(--mute);font-family:var(--sans)}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding-top:24px}
.pager button{min-width:34px;background:none;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:6px 11px;font:500 13px/1.2 var(--mono);cursor:pointer;transition:color .15s,border-color .15s}
.pager button:hover:not(:disabled){color:#fff;border-color:#666}
.pager button[aria-current="page"]{background:#fff;color:#000;border-color:#fff}
.pager button:disabled{opacity:.35;cursor:default}
.pager small{margin-left:8px;color:var(--dim);font:12px/1 var(--mono)}
@media(max-width:600px){th,td{padding:10px 8px}}
</style>
</head>

<script>
// ---- EDIT THESE ----
const CONFIG = { womGroup: 1152, perPage: 50 };
// --------------------

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => n == null ? "—" : Math.round(n).toLocaleString();
// Our names for Wise Old Man roles (numbered ranks match the About page); any other role keeps its Wise Old Man name
const RANK_NAMES = { general:"Owner", captain:"Officer", lieutenant:"Community Leader", astral:"Legacy Star", quester:"Events Team", helper:"Trialist", elite:"Clan Mate", recruit:"Rank 1", pawn:"Rank 2", corporal:"Rank 3", novice:"Rank 4", sergeant:"Rank 5", colonel:"Rank 6", marshal:"Rank 7" };
const roleName = r => RANK_NAMES[r] || r.split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
// Wise Old Man's own role icons, served from their open-source repo
const roleIcon = r => `https://cdn.jsdelivr.net/gh/wise-old-man/wise-old-man@master/app/public/img/group_roles/${r}.png`;
const BASES = ["https://api.wiseoldman.net/v2/", "/api/wom/"];
const get = async path => { let err;
  for (const b of BASES) {
    try { const r = await fetch(b + path); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
    catch (e) { err = e; } }
  throw err; };

const COLS = [
  {k:null,   label:"#"},
  {k:"name", label:"Player",      text:true},
  {k:"lvl",  label:"Total Level"},
  {k:"xp",   label:"Overall XP"},
  {k:"ehb",  label:"EHB"},
  {k:"ehp",  label:"EHP"},
  {k:"clog", label:"Collection Log"}
];
const S = { all: [], q: "", rank: "", key: "xp", dir: -1, page: 0 };

const sortVal = (m, k) => k === "name" ? m.name.toLowerCase() : m[k];
function sorted(){
  return S.all.slice().sort((a, b) => {
    const x = sortVal(a, S.key), y = sortVal(b, S.key);
    if (x == null || y == null) return (x == null) - (y == null) || b.xp - a.xp;   // missing values always last
    const c = typeof x === "string" ? x.localeCompare(y) : x - y;
    return c * S.dir || b.xp - a.xp;
  });
}

function render(){
  $("head").innerHTML = COLS.map(c => `<th${c.k ? ` data-k="${c.k}"` : ""} class="${c.k === S.key ? "on" + (S.dir > 0 ? " asc" : "") : ""}">${c.label}</th>`).join("");
  const q = S.q.trim().toLowerCase();
  const list = sorted().map((m, i) => ({...m, n: i + 1}))
    .filter(m => (!S.rank || roleName(m.role) === S.rank) && (!q || m.name.toLowerCase().includes(q) || m.user.includes(q)));
  const pages = Math.max(1, Math.ceil(list.length / CONFIG.perPage));
  S.page = Math.min(S.page, pages - 1);
  const rows = list.slice(S.page * CONFIG.perPage, (S.page + 1) * CONFIG.perPage);
  $("rows").innerHTML = rows.map(m => `<tr>
    <td class="n">${m.n}</td>
    <td><span class="player"><img src="${roleIcon(m.role)}" alt="${esc(roleName(m.role))}" title="${esc(roleName(m.role))}" loading="lazy" onerror="this.style.visibility='hidden'"><a href="player.html?name=${encodeURIComponent(m.name)}">${esc(m.name)}</a></span></td>
    <td>${num(m.lvl)}</td><td>${num(m.xp)}</td><td>${num(m.ehb)}</td><td>${num(m.ehp)}</td><td>${num(m.clog)}</td></tr>`).join("")
    || `<tr><td colspan="7" class="msg">No members match${q ? ` “${esc(S.q)}”` : ""}${S.rank ? ` in ${esc(S.rank)}` : ""}.</td></tr>`;
  $("count").textContent = q || S.rank ? `${list.length} of ${S.all.length} members` : `${S.all.length} Kingdom Members`;
  let p = `<button data-p="${S.page - 1}" ${S.page ? "" : "disabled"}>‹ Prev</button>`;
  for (let i = 0; i < pages; i++) p += `<button data-p="${i}"${i === S.page ? ' aria-current="page"' : ""}>${i + 1}</button>`;
  p += `<button data-p="${S.page + 1}" ${S.page < pages - 1 ? "" : "disabled"}>Next ›</button>`;
  p += `<small>${list.length ? `${S.page * CONFIG.perPage + 1}–${S.page * CONFIG.perPage + rows.length} of ${list.length}` : ""}</small>`;
  $("pager").innerHTML = p;
}

$("head").addEventListener("click", e => { const k = e.target.closest("th")?.dataset.k; if (!k) return;
  if (k === S.key) S.dir *= -1; else { S.key = k; S.dir = COLS.find(c => c.k === k).text ? 1 : -1; }
  S.page = 0; render(); });
$("pager").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled) return;
  S.page = +b.dataset.p; render(); document.querySelector("main .sec").scrollIntoView({behavior:"smooth", block:"start"}); });
$("q").addEventListener("input", e => { S.q = e.target.value; S.page = 0; render(); });
$("rank").addEventListener("change", e => { S.rank = e.target.value; S.page = 0; render(); });

async function load(){
  try {
    const [group, levels, clogs] = await Promise.all([
      get(`groups/${CONFIG.womGroup}`),
      get(`groups/${CONFIG.womGroup}/hiscores?metric=overall&limit=500`).catch(() => []),
      get(`groups/${CONFIG.womGroup}/hiscores?metric=collections_logged&limit=500`).catch(() => [])
    ]);
    const lvl = {}; levels.forEach(h => { if (h.data && h.data.level > 0) lvl[h.player.id] = h.data.level; });
    const clog = {}; clogs.forEach(h => { if (h.data && h.data.score >= 0) clog[h.player.id] = h.data.score; });
    S.all = (group.memberships || []).map(m => ({ role: m.role, name: m.player.displayName, user: m.player.username,
      lvl: lvl[m.player.id] ?? null, xp: m.player.exp, ehb: m.player.ehb, ehp: m.player.ehp, clog: clog[m.player.id] ?? null }));
    // Wise Old Man lists members highest rank first, so the dropdown follows the clan's rank order
    // Grouped by the name we show, so roles sharing a name (e.g. Owner) are one option
    const counts = {}; S.all.forEach(m => { const n = roleName(m.role); counts[n] = (counts[n] || 0) + 1; });
    $("rank").innerHTML = `<option value="">All ranks</option>` + Object.keys(counts).map(n => `<option value="${esc(n)}">${esc(n)} (${counts[n]})</option>`).join("");
    render();
  } catch (e) {
    $("rows").innerHTML = `<tr><td colspan="7" class="msg">Couldn't load members from Wise Old Man (${esc(e.message)}). Try again later.</td></tr>`;
  }
}
load();

</script>
</body>
</html>
