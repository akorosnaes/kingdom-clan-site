<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Members | Kingdom</title>
<style>
:root{--bg:#080808;--panel:#121212;--panel2:#1c1c1c;--line:#2a2a2a;--ink:#fff;--mute:#a0a0a0;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
nav{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 12px;border-bottom:1px solid var(--line)}
nav a{color:var(--mute);text-decoration:none;padding:7px 16px;font-size:14px;font-weight:500;border-radius:8px}
nav a.on,nav a:hover{color:#fff;background:var(--panel2)}
nav a.navbtn{margin-left:8px;background:#5865F2;color:#fff;font-weight:600;white-space:nowrap}
nav a.navbtn:hover{background:#4752C4}
@media(max-width:600px){nav{gap:0;padding:10px 4px;justify-content:safe center;overflow-x:auto}nav a{padding:6px 7px;font-size:13px;white-space:nowrap}nav .navlogo,nav .long{display:none}nav a.navbtn{margin-left:4px}}
.hero{text-align:center;padding:48px 20px 28px}
.logo{display:block;width:min(360px,80%);height:auto;margin:0 auto 14px}
.navlogo{height:22px;width:auto;display:block;margin-right:10px}
.hero .tag{margin:0 auto 6px;color:#fff;font-weight:700;font-size:20px;letter-spacing:.04em}
main{max-width:1000px;margin:0 auto;padding:8px 16px 56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
footer{text-align:center;padding:24px;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}

.tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.tools h2{margin:0;font-size:15px;font-weight:600}
.search{flex:1;min-width:180px;max-width:320px;background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:8px;padding:9px 12px;font:inherit;font-size:14px}
.search:focus{outline:none;border-color:#555}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
th:first-child{cursor:default}
th:hover,th.on{color:#fff}
th.on::after{content:" \25BE"}
th.on.asc::after{content:" \25B4"}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border:0}
td.n{color:var(--mute);width:1%}
td a{color:#fff;text-decoration:none;font-weight:600}
td a:hover{text-decoration:underline;text-underline-offset:3px}
.player{display:flex;align-items:center;gap:8px}
.player img{flex:none;width:18px;height:18px;display:block}
.msg{padding:28px 18px;text-align:center;color:var(--mute)}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.pager button{min-width:36px;background:var(--panel2);color:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.pager button:hover:not(:disabled){border-color:#555}
.pager button[aria-current="page"]{background:#fff;color:#000;border-color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.pager small{color:var(--mute);font-size:13px;margin-left:6px}
@media(max-width:600px){th,td{padding:9px 10px}}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
nav,.hero,main,footer{position:relative;z-index:1}
nav{position:sticky;top:0;z-index:10;background:rgba(8,8,8,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.card{animation:rise .7s .3s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main>
  <section class="card">
    <div class="tools"><h2 id="count">Kingdom Members</h2><input class="search" id="q" type="search" placeholder="Search members…" aria-label="Search members" autocomplete="off"></div>
    <div class="tbl"><table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="msg">Loading members…</td></tr></tbody>
    </table></div>
    <div class="pager" id="pager"></div>
  </section>
</main>
<footer>Made with ❤️ by Sean</footer>

<script>
// ---- EDIT THESE ----
const CONFIG = { womGroup: 1152, perPage: 50 };
// --------------------

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => n == null ? "—" : Math.round(n).toLocaleString();
const roleName = r => r.split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
// Wise Old Man's own role icons, served from their open-source repo
const roleIcon = r => `https://cdn.jsdelivr.net/gh/wise-old-man/wise-old-man@master/app/public/img/group_roles/${r}.png`;
const BASES = ["/api/wom/", "https://api.wiseoldman.net/v2/"];
const get = async path => { let err;
  for (const b of BASES) {
    try { const r = await fetch(b + path); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
    catch (e) { err = e; } }
  throw err; };

const COLS = [
  {k:null,   label:"#"},
  {k:"name", label:"Player",      text:true},
  {k:"lvl",  label:"Total Level"},
  {k:"xp",   label:"Overall XP"},
  {k:"ehb",  label:"EHB"},
  {k:"ehp",  label:"EHP"}
];
const S = { all: [], q: "", key: "xp", dir: -1, page: 0 };

const sortVal = (m, k) => k === "name" ? m.name.toLowerCase() : m[k];
function sorted(){
  return S.all.slice().sort((a, b) => {
    const x = sortVal(a, S.key), y = sortVal(b, S.key);
    if (x == null || y == null) return (x == null) - (y == null) || b.xp - a.xp;   // missing values always last
    const c = typeof x === "string" ? x.localeCompare(y) : x - y;
    return c * S.dir || b.xp - a.xp;
  });
}

function render(){
  $("head").innerHTML = COLS.map(c => `<th${c.k ? ` data-k="${c.k}"` : ""} class="${c.k === S.key ? "on" + (S.dir > 0 ? " asc" : "") : ""}">${c.label}</th>`).join("");
  const q = S.q.trim().toLowerCase();
  const list = sorted().map((m, i) => ({...m, n: i + 1}))
    .filter(m => !q || m.name.toLowerCase().includes(q) || m.user.includes(q));
  const pages = Math.max(1, Math.ceil(list.length / CONFIG.perPage));
  S.page = Math.min(S.page, pages - 1);
  const rows = list.slice(S.page * CONFIG.perPage, (S.page + 1) * CONFIG.perPage);
  $("rows").innerHTML = rows.map(m => `<tr>
    <td class="n">${m.n}</td>
    <td><span class="player"><img src="${roleIcon(m.role)}" alt="${esc(roleName(m.role))}" title="${esc(roleName(m.role))}" loading="lazy" onerror="this.style.visibility='hidden'"><a href="https://wiseoldman.net/players/${encodeURIComponent(m.user)}" target="_blank" rel="noopener">${esc(m.name)}</a></span></td>
    <td>${num(m.lvl)}</td><td>${num(m.xp)}</td><td>${num(m.ehb)}</td><td>${num(m.ehp)}</td></tr>`).join("")
    || `<tr><td colspan="6" class="msg">No members match “${esc(S.q)}”.</td></tr>`;
  $("count").textContent = q ? `${list.length} of ${S.all.length} members` : `${S.all.length} Kingdom Members`;
  let p = `<button data-p="${S.page - 1}" ${S.page ? "" : "disabled"}>‹ Prev</button>`;
  for (let i = 0; i < pages; i++) p += `<button data-p="${i}"${i === S.page ? ' aria-current="page"' : ""}>${i + 1}</button>`;
  p += `<button data-p="${S.page + 1}" ${S.page < pages - 1 ? "" : "disabled"}>Next ›</button>`;
  p += `<small>${list.length ? `${S.page * CONFIG.perPage + 1}–${S.page * CONFIG.perPage + rows.length} of ${list.length}` : ""}</small>`;
  $("pager").innerHTML = p;
}

$("head").addEventListener("click", e => { const k = e.target.closest("th")?.dataset.k; if (!k) return;
  if (k === S.key) S.dir *= -1; else { S.key = k; S.dir = COLS.find(c => c.k === k).text ? 1 : -1; }
  S.page = 0; render(); });
$("pager").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled) return;
  S.page = +b.dataset.p; render(); document.querySelector("main .card").scrollIntoView({behavior:"smooth", block:"start"}); });
$("q").addEventListener("input", e => { S.q = e.target.value; S.page = 0; render(); });

async function load(){
  try {
    const [group, levels] = await Promise.all([
      get(`groups/${CONFIG.womGroup}`),
      get(`groups/${CONFIG.womGroup}/hiscores?metric=overall&limit=500`).catch(() => [])
    ]);
    const lvl = {}; levels.forEach(h => { if (h.data && h.data.level > 0) lvl[h.player.id] = h.data.level; });
    S.all = (group.memberships || []).map(m => ({ role: m.role, name: m.player.displayName, user: m.player.username,
      lvl: lvl[m.player.id] ?? null, xp: m.player.exp, ehb: m.player.ehb, ehp: m.player.ehp }));
    render();
  } catch (e) {
    $("rows").innerHTML = `<tr><td colspan="6" class="msg">Couldn't load members from Wise Old Man (${esc(e.message)}). Try again later.</td></tr>`;
  }
}
load();

// Slow drifting dust motes in the background
(function(){
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let w, h, dpr, P = [];
  const rnd = (a,b) => a + Math.random()*(b-a);
  function size(){ dpr = Math.min(devicePixelRatio||1, 2); w = innerWidth; h = innerHeight;
    cv.width = w*dpr; cv.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(70, w/22)); while (P.length < n) P.push(mk(true)); P.length = n; }
  function mk(any){ return {x:rnd(0,w), y:any?rnd(0,h):h+10, r:rnd(.6,1.8), v:rnd(.08,.28), a:rnd(.12,.45), ph:rnd(0,6.28), sw:rnd(.15,.5)}; }
  let t = 0;
  function frame(){
    if (!document.hidden) { t += .01; ctx.clearRect(0,0,w,h);
      for (const p of P) { p.y -= p.v; p.x += Math.sin(t*p.sw + p.ph)*.18;
        if (p.y < -10) Object.assign(p, mk(false));
        ctx.globalAlpha = p.a * (0.6 + 0.4*Math.sin(t*p.sw*3 + p.ph)); ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); } }
    requestAnimationFrame(frame); }
  size(); addEventListener("resize", size); frame();
})();
</script>
