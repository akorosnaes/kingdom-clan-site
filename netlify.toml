# Static site, no build step. Functions power the staff console (Discord login + calendar uploads).
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The Bingo link preview image draws with resvg (WebAssembly) and the Geist font files
[functions."og-bingo"]
  included_files = ["node_modules/@resvg/resvg-wasm/index_bg.wasm", "netlify/og/*"]

# Keep the staff console out of search results
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
