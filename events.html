<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Events | Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--panel:#121212;--panel2:#1c1c1c;--line:#232323;--line2:#333;--ink:#fff;--mute:#9a9a9a;--dim:#5f5f5f;
--sans:Geist,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}

/* Nav */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:2px;padding:12px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
nav a{color:var(--mute);text-decoration:none;padding:6px 14px;font-size:14px;font-weight:500;border-radius:6px;transition:color .15s}
nav a:hover{color:#fff}
nav a.on{color:#fff;background:var(--panel2)}
nav a.navbtn{margin-left:10px;background:#5865F2;color:#fff;font-weight:600;white-space:nowrap}
nav a.navbtn:hover{background:#4752C4}
.navlogo{height:22px;width:auto;display:block;margin-right:12px}
@media(max-width:600px){nav{gap:0;padding:10px 4px;justify-content:safe center;overflow-x:auto}nav a{padding:6px 7px;font-size:13px;white-space:nowrap}nav .navlogo,nav .long{display:none}nav a.navbtn{margin-left:4px}}

/* Page title */
.phero{max-width:1080px;margin:0 auto;padding:64px 20px 0}
.phero h1{margin:0;font:600 clamp(36px,6vw,56px)/1.05 var(--sans);letter-spacing:-.04em}
.phero p{margin:14px 0 0;font:500 12px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
main{max-width:1080px;margin:0 auto;padding:8px 20px 72px}

/* Section headers, labels, shared bits */
.sec{margin-top:56px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.sech h2{margin:0;font:600 clamp(22px,3vw,28px)/1.1 var(--sans);letter-spacing:-.03em}
.sech small{font:500 12px/1 var(--mono);color:var(--mute);letter-spacing:.06em}
.mlab{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.rk{flex:none;display:inline-grid;place-items:center;min-width:22px;font:500 13px/1 var(--mono);color:var(--dim)}
.rk.m1{color:#fff}
.msg{padding:28px 0;color:var(--mute);font-size:14px}
.ghost{background:none;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:8px 16px;font:500 13px/1.2 var(--sans);cursor:pointer;transition:border-color .15s}
.ghost:hover{border-color:#fff}

footer{text-align:center;padding:28px 20px;color:var(--dim);font:12px/1 var(--mono);letter-spacing:.04em;border-top:1px solid var(--line)}

/* One quiet entrance for the page */
@keyframes fade{from{opacity:0}to{opacity:1}}
.phero,main{animation:fade .6s ease both}
main{animation-delay:.1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Section headings (events uses .sec as the heading row) */
.sec{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:56px 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.sec h2{margin:0;font:600 clamp(22px,3vw,28px)/1.1 var(--sans);letter-spacing:-.03em}
.sec small{font:500 12px/1 var(--mono);color:var(--mute);letter-spacing:.06em}
.stack{display:grid;gap:10px}

/* Event banners: each its own rectangle */
.card{background:#0d0d0d;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.evh{display:flex;gap:14px;align-items:center;padding:16px 18px}
.evh .mi{flex:none;width:36px;height:36px;display:grid;place-items:center}
.evh .mi img{width:30px;height:30px;display:block;object-fit:contain;image-rendering:pixelated}
.evh div{flex:1;min-width:0}
.evh h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.evh small{display:block;margin-top:4px;font:12px/1.4 var(--mono);color:var(--dim)}
.acts{flex:none;display:flex;gap:8px;align-items:center}
.evh a,.xbtn{display:inline-flex;align-items:center;gap:7px;background:none;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font:500 12px/1.2 var(--sans);text-decoration:none;cursor:pointer;transition:color .15s,border-color .15s}
.evh a:hover,.xbtn:hover,.ev .evh:hover .xbtn{color:#fff;border-color:#666}
.xbtn::after{content:"";width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.ev .evh{cursor:pointer}
.ev.open .xbtn{color:#fff}
.ev.open .xbtn::after{transform:translateY(1px) rotate(-135deg)}
.ev .st{display:none;border-top:1px solid var(--line)}
.ev.open .st{display:block;animation:fade .25s ease both}
#now .card .evh{border-bottom:1px solid var(--line)}
.cols{display:grid;grid-template-columns:1fr 1fr}
.cols>div+div{border-left:1px solid var(--line)}
@media(max-width:700px){.cols{grid-template-columns:1fr}.cols>div+div{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:600px){.evh{flex-wrap:wrap}.acts{width:100%;justify-content:flex-end}}

/* Live / upcoming */
.tagl{display:inline-flex;align-items:center;gap:7px;margin-bottom:6px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.tagl.live{color:#fff}
.tagl.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#ef4444;animation:pulse 1.6s ease-in-out infinite}
.tagl.soon{color:var(--mute)}
.tagl.soon::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
@keyframes pulse{50%{opacity:.3}}
.cd{display:flex;gap:28px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:flex-end}
.cd b{display:block;font:500 28px/1 var(--mono);letter-spacing:-.03em}
.cd small{display:block;margin-top:8px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* Standings */
.row{display:flex;gap:14px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{font-weight:600}
.row small{margin-left:8px;font:12px/1 var(--mono);color:var(--dim)}
.val{flex:none;font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums}
.lab{padding:14px 18px 2px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.msg{padding:18px;color:var(--mute);font-size:14px}
.empty{padding:36px 24px;text-align:center}
.empty h3{margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.empty p{margin:0 auto 20px;max-width:480px;color:var(--mute);font-size:14px}
.empty b{color:#fff}
.btn{display:inline-block;background:#5865F2;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 20px;border-radius:6px}
.btn:hover{background:#4752C4}
.more{display:block;margin:20px auto 0;background:none;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:9px 18px;font:500 13px/1.2 var(--sans);cursor:pointer;transition:border-color .15s}
.more:hover{border-color:#fff}
.retry{display:block;width:100%;background:none;border:0;padding:18px;color:var(--mute);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.retry:hover{color:#fff}
</style>
</head>

<script>
// ---- EDIT THESE ----
const CONFIG = { womGroup: 1152, discord: "https://discord.gg/kingdomclan", pastPerPage: 8 };
// --------------------

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// WOM allows CORS, so call it directly first: its rate limit (~20 requests/min) is then per visitor, not shared through the proxy
const BASES = ["https://api.wiseoldman.net/v2/", "/api/wom/"];
const get = async path => { let err;
  for (const b of BASES) {
    try { const r = await fetch(b + path); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
    catch (e) { if (e.message === "HTTP 429") throw e; err = e; } }   // rate limited: let the caller wait and retry
  throw err; };

// Metric names, icons and units
const SKILLS = ["overall","attack","defence","strength","hitpoints","ranged","prayer","magic","cooking","woodcutting","fletching","fishing","firemaking","crafting","smithing","mining","herblore","agility","thieving","slayer","farming","runecrafting","hunter","construction","sailing"];
const ACTIVITY = /^(league|bounty|clue|last_man|pvp|soul_wars|guardians|colosseum|collections)/;
const metricName = m => m === "ehb" ? "EHB" : m === "ehp" ? "EHP"
  : m.split("_").map((w,i) => (i && ["of","the","and"].includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
const metricIcon = m => `https://cdn.jsdelivr.net/gh/wise-old-man/wise-old-man@master/app/public/img/metrics/${m}.png`;
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(2)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e4 ? Math.round(n/1e3)+"K" : Math.round(n).toLocaleString();
const gainText = (m, v) => m === "ehb" || m === "ehp" ? v.toFixed(1) + " " + m.toUpperCase()
  : SKILLS.includes(m) ? fmt(v) + " xp" : ACTIVITY.test(m) ? Math.round(v).toLocaleString() : Math.round(v).toLocaleString() + " kc";

const dayFmt = new Intl.DateTimeFormat(undefined, {month:"short", day:"numeric"});
const dateRange = (a, b) => { const y = b.getFullYear() !== new Date().getFullYear() || a.getFullYear() !== b.getFullYear() ? ", " + b.getFullYear() : "";
  return dayFmt.format(a) + " – " + dayFmt.format(b) + y; };
const ago = t => { const m = Math.max(1, Math.round((Date.now() - t) / 6e4));
  return m < 60 ? m + "m ago" : m < 1440 ? Math.round(m/60) + "h ago" : m < 1440*60 ? Math.round(m/1440) + "d ago" : Math.round(m/43200) + " months ago"; };
const span = ms => { ms = Math.max(0, ms); const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5) % 24, m = Math.floor(ms/6e4) % 60;
  return [[d,"days"],[h,"hours"],[m,"mins"]]; };

// Cache: event list + finished events' results (those never change), per browser
const CACHE_KEY = "kingdom-events-v1";
let cache = { list: null, res: {} };
try { cache = Object.assign(cache, JSON.parse(localStorage.getItem(CACHE_KEY)) || {}); } catch (e) {}
const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} };

// Boil a competition's full standings down to what the cards show
function summarize(d){
  const ps = (d.participations || []).map(p => ({p: p.player.displayName, team: p.teamName, g: (p.progress && p.progress.gained) || 0}))
    .filter(p => p.g > 0).sort((a, b) => b.g - a.g);
  const teams = {};
  (d.participations || []).forEach(p => { if (!p.teamName) return;
    const t = teams[p.teamName] || (teams[p.teamName] = {name: p.teamName, n: 0, g: 0});
    t.n++; t.g += (p.progress && p.progress.gained) || 0; });
  return { players: ps.slice(0, 10), teams: Object.values(teams).sort((a, b) => b.g - a.g) };
}

const rk = i => `<span class="rk${i < 3 ? " m" + (i + 1) : ""}">${i + 1}</span>`;
function standings(c, s, n){
  if (!s.players.length && !s.teams.length) return '<div class="msg">No progress recorded yet.</div>';
  const players = s.players.slice(0, n).map((p, i) =>
    `<div class="row">${rk(i)}<div><b>${esc(p.p)}</b>${s.teams.length > 1 && p.team ? `<small>${esc(p.team)}</small>` : ""}</div><span class="val">${gainText(c.metric, p.g)}</span></div>`).join("");
  if (!s.teams.length) return players;
  // Team events: teams on the left, top players on the right (stacked on phones)
  const teams = s.teams.length > 1
    ? s.teams.slice(0, n).map((t, i) => `<div class="row">${rk(i)}<div><b>${esc(t.name)}</b><small>${t.n} players</small></div><span class="val">${gainText(c.metric, t.g)}</span></div>`).join("")
    : `<div class="row"><div><b>${esc(s.teams[0].name)}</b><small>team total</small></div><span class="val">${gainText(c.metric, s.teams[0].g)}</span></div>`;
  return `<div class="cols"><div><div class="lab">${s.teams.length > 1 ? "Teams" : "Team"}</div>${teams}</div><div><div class="lab">Top players</div>${players}</div></div>`;
}

function header(c, tag, actions){
  const a = new Date(c.startsAt), b = new Date(c.endsAt);
  return `<div class="evh"><span class="mi"><img src="${metricIcon(c.metric)}" alt="" loading="lazy" onerror="this.remove()"></span>
    <div>${tag || ""}<h3>${esc(c.title)}</h3><small>${esc(metricName(c.metric))} · ${dateRange(a, b)} · ${c.participantCount} players${c.type === "team" ? " · Team" : ""}</small></div>
    <span class="acts">${actions || ""}<a href="https://wiseoldman.net/competitions/${c.id}" target="_blank" rel="noopener">WOM ↗</a></span></div>`;
}

// ---- Now & upcoming ----
function countdown(c){
  const now = Date.now(), live = new Date(c.startsAt) <= now;
  const parts = span((live ? new Date(c.endsAt) : new Date(c.startsAt)) - now);
  return `<div class="cd">${parts.map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join("")}<div><small>${live ? "until it ends" : "until it starts"}</small></div></div>`;
}
function renderNow(list){
  const now = Date.now();
  const cur = list.filter(c => new Date(c.endsAt) > now).sort((a, b) => new Date(a.startsAt) - new Date(b.startsAt));
  if (!cur.length) {
    const last = list.filter(c => new Date(c.endsAt) <= now).sort((a, b) => new Date(b.endsAt) - new Date(a.endsAt))[0];
    $("now").innerHTML = `<div class="card empty"><h3>No events running right now</h3>
      <p>New events show up here as soon as they're scheduled.${last ? ` Our last one, <b>${esc(last.title)}</b>, ended ${ago(new Date(last.endsAt))}.` : ""} Join the Discord to hear about the next one first.</p>
      <a class="btn" href="${CONFIG.discord}">Join the Discord</a></div>`;
    return;
  }
  $("now").innerHTML = cur.map(c => {
    const live = new Date(c.startsAt) <= now;
    return `<article class="card" data-id="${c.id}">${header(c, live ? '<span class="tagl live">Live</span>' : '<span class="tagl soon">Upcoming</span>')}
      <div class="cdw">${countdown(c)}</div>
      ${live ? '<div class="st"><div class="msg">Loading standings…</div></div>' : ""}</article>`; }).join("");
  cur.filter(c => new Date(c.startsAt) <= now).forEach(c => {
    const el = document.querySelector(`#now [data-id="${c.id}"] .st`);
    get(`competitions/${c.id}`).then(d => { el.innerHTML = standings(c, summarize(d), 10) + `<div class="msg" style="padding:10px 18px;font-size:12px">Standings update as players are tracked on Wise Old Man.</div>`; })
      .catch(e => { el.innerHTML = `<div class="msg">Couldn't load standings (${esc(e.message)}).</div>`; });
  });
  clearInterval(renderNow.t);
  renderNow.t = setInterval(() => cur.forEach(c => { const w = document.querySelector(`#now [data-id="${c.id}"] .cdw`); if (w) w.innerHTML = countdown(c); }), 30000);
}

// ---- Past events: collapsed banners; results load the first time one is expanded ----
let pastList = [], shownPast = 0;
// Results requests go through a small queue: 2 at a time, and if WOM says "too many requests" (429) we wait and retry
const sleep = ms => new Promise(r => setTimeout(r, ms));
const queue = []; let active = 0;
const fetchResult = (id, onWait) => new Promise((res, rej) => { queue.push({id, res, rej, onWait}); pump(); });
async function pump(){
  if (active >= 2 || !queue.length) return;
  active++; const j = queue.shift();
  for (let tries = 0; ; tries++) {
    try { j.res(await get(`competitions/${j.id}`)); break; }
    catch (e) { if (e.message === "HTTP 429" && tries < 4) { j.onWait(); await sleep(20000); continue; } j.rej(e); break; }
  }
  active--; pump();
}
function loadResult(el){
  const c = pastList.find(c => String(c.id) === el.dataset.id), box = el.querySelector(".st");
  const done = s => box.innerHTML = standings(c, s, 3);
  if (cache.res[c.id]) return done(cache.res[c.id]);
  box.innerHTML = '<div class="msg">Loading results…</div>';
  fetchResult(c.id, () => box.innerHTML = '<div class="msg">Wise Old Man is busy, retrying shortly…</div>')
    .then(d => { const s = summarize(d); s.players = s.players.slice(0, 3); s.teams = s.teams.slice(0, 3);
      cache.res[c.id] = s; saveCache(); done(s); })
    .catch(e => { box.innerHTML = `<button class="retry" type="button">Couldn't load results (${esc(e.message)}). Tap to retry</button>`;
      box.querySelector(".retry").onclick = () => loadResult(el); });
}
function showMorePast(){
  const next = pastList.slice(shownPast, shownPast + CONFIG.pastPerPage);
  $("past").insertAdjacentHTML("beforeend", next.map(c =>
    `<article class="card ev" data-id="${c.id}">${header(c, "", '<button class="xbtn" type="button" aria-expanded="false">Expand</button>')}<div class="st"></div></article>`).join(""));
  shownPast += next.length;
  $("more").hidden = shownPast >= pastList.length;
}
$("more").onclick = showMorePast;
// Clicking a banner (anywhere but the WOM link) expands or collapses it
$("past").addEventListener("click", e => {
  const el = e.target.closest(".ev"); if (!el || e.target.closest("a, .retry") || !e.target.closest(".evh")) return;
  const open = el.classList.toggle("open"), b = el.querySelector(".xbtn");
  b.textContent = open ? "Collapse" : "Expand"; b.setAttribute("aria-expanded", open);
  if (open && !el.querySelector(".st").innerHTML) loadResult(el);
});
function renderPast(list){
  pastList = list.filter(c => new Date(c.endsAt) <= Date.now()).sort((a, b) => new Date(b.endsAt) - new Date(a.endsAt));
  $("pastCount").textContent = pastList.length ? pastList.length + " events" : "";
  $("past").innerHTML = pastList.length ? "" : '<div class="card msg">No past events yet.</div>';
  shownPast = 0; if (pastList.length) showMorePast();
}

function render(list){ renderNow(list); renderPast(list); }
if (cache.list) render(cache.list);
get(`groups/${CONFIG.womGroup}/competitions`).then(list => {
  const slim = list.map(({id, title, type, metric, startsAt, endsAt, participantCount}) => ({id, title, type, metric, startsAt, endsAt, participantCount}));
  if (JSON.stringify(slim) !== JSON.stringify(cache.list)) render(slim);
  cache.list = slim; saveCache();
}).catch(e => {
  if (!cache.list) $("now").innerHTML = `<div class="card msg">Couldn't load events from Wise Old Man (${esc(e.message)}). Try again later.</div>`;
  else $("note").textContent = "Showing saved events; couldn't refresh from Wise Old Man.";
});

</script>
