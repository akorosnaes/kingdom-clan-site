<style>
:root{--bg:#080808;--panel:#121212;--panel2:#1c1c1c;--line:#232323;--line2:#333;--ink:#fff;--mute:#9a9a9a;--dim:#5f5f5f;
--sans:Geist,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}

/* Nav */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:2px;padding:12px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
nav a{color:var(--mute);text-decoration:none;padding:6px 14px;font-size:14px;font-weight:500;border-radius:6px;transition:color .15s}
nav a:hover{color:#fff}
nav a.on{color:#fff;background:var(--panel2)}
nav a.navbtn{margin-left:10px;background:#5865F2;color:#fff;font-weight:600;white-space:nowrap}
nav a.navbtn:hover{background:#4752C4}
.navsoc{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
nav .navsoc a{display:grid;place-items:center;padding:7px}
.navsoc svg,.fsoc svg{width:18px;height:18px;display:block}
.navsoc img,.fsoc img{height:18px;width:auto;display:block;opacity:.75;transition:opacity .15s}
.navsoc a:hover img,.fsoc a:hover img{opacity:1}
.fsoc{display:none}
.fsoc a{display:grid;place-items:center;padding:8px;color:var(--mute)}
@media(max-width:960px){.navsoc{position:static;transform:none;margin-left:8px}}
@media(max-width:760px){nav .navlogo{display:none}nav a{white-space:nowrap}}
.navlogo{height:22px;width:auto;display:block;margin-right:12px}
@media(max-width:600px){nav{gap:0;padding:10px 4px;justify-content:safe center;overflow-x:auto}nav a{padding:6px 7px;font-size:13px;white-space:nowrap}nav .navlogo,nav .long,.navsoc{display:none}.fsoc{display:flex;justify-content:center;gap:8px;margin:-12px 0 14px}nav a.navbtn{margin-left:4px}}

/* Hero */
.hero{text-align:center;padding:72px 20px 0}
.logo{display:block;width:min(500px,84%);height:auto;margin:0 auto 26px}
.hero h1{position:absolute;left:-9999px}
.hero .tag{margin:0 0 10px;font:500 12px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.hero .req{margin:0;font-size:14px;color:var(--mute)}
.hero .req a{color:#fff;text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:4px}
.hero .req a:hover{text-decoration-color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);max-width:880px;margin:56px auto 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:22px 12px 20px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:500 clamp(28px,4.4vw,40px)/1 var(--mono);letter-spacing:-.03em}
.stat small{display:block;margin-top:10px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* Sections */
main{max-width:1080px;margin:0 auto;padding:16px 20px 72px}
.sec{margin-top:64px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.sech h2{margin:0;font:600 clamp(24px,3.4vw,30px)/1.1 var(--sans);letter-spacing:-.03em}
.sech small{font:500 12px/1 var(--mono);color:var(--mute);letter-spacing:.06em}
.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:40px}
@media(max-width:860px){.cols3{grid-template-columns:1fr}}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.col h3{margin:22px 0 4px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* Rows */
.row{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ic{flex:none;width:30px;height:30px;display:grid;place-items:center}
.ic img{max-width:30px;max-height:30px;display:block}
.row div{flex:1;min-width:0}
.row b{font-weight:600}
a.pl{color:inherit;text-decoration:none}
a.pl:hover{text-decoration:underline;text-underline-offset:3px}
.row small{display:block;margin-top:2px;font:400 12px/1.3 var(--mono);color:var(--dim)}
.xp{flex:none;font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums}
.rank{flex:none;width:22px;font:500 13px/1 var(--mono);color:var(--dim)}
.row:first-child .rank{color:#fff}
.note{margin-top:40px;color:var(--dim);font:12px/1.5 var(--mono);text-align:center}

/* Period tabs */
.seg{display:flex;gap:18px}
.seg button{background:none;border:0;border-bottom:1px solid transparent;padding:0 0 4px;color:var(--mute);font:500 13px/1 var(--sans);cursor:pointer;transition:color .15s,border-color .15s}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{color:#fff;border-bottom-color:#fff}

footer{text-align:center;padding:28px 20px;color:var(--dim);font:12px/1 var(--mono);letter-spacing:.04em;border-top:1px solid var(--line)}

/* One quiet entrance for the page; content swaps without animation */
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero,main{animation:fade .6s ease both}
main{animation-delay:.1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    {p:"Zezima",n:"1,000 Vorkath kills",m:"vorkath",t:Date.now()-27*36e5},
    {p:"Mod Mage",n:"Base 70 Stats",m:"overall",t:Date.now()-50*36e5}],
  top: [{p:"Zezima",x:12450000},{p:"Iron Bob",x:9820000},{p:"PkerDave",x:7310000},{p:"LumbyLad",x:5990000},{p:"Mod Mage",x:4120000}],
  ehp: [{p:"Iron Bob",x:54.2},{p:"Zezima",x:48.7},{p:"LumbyLad",x:31.5},{p:"Mod Mage",x:22.9},{p:"PkerDave",x:12.4}],
  ehb: [{p:"PkerDave",x:97.6},{p:"Zezima",x:81.3},{p:"Iron Bob",x:60.8},{p:"LumbyLad",x:44.1},{p:"Mod Mage",x:19.5}],
  members: null,
  stats: null
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = t => { const m = Math.max(1, Math.round((Date.now()-t)/6e4));
  if (m < 60) return m+"m ago"; if (m < 1440) return Math.round(m/60)+"h ago"; return Math.round(m/1440)+"d ago"; };
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(2)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(0)+"K" : String(n);
const DBG = [];
const BASES = {temple:["/api/temple/","https://templeosrs.com/api/"], wom:["https://api.wiseoldman.net/v2/","/api/wom/"]};
const get = async (svc, path) => { let err;
  for (const b of BASES[svc]) {
    try { const r = await fetch(b + path); const t = await r.text();
      DBG.push((r.ok ? "OK " : "HTTP " + r.status + " ") + b + path + "\n" + t.slice(0, 700));
      if (!r.ok) throw new Error("HTTP " + r.status);
      try { return JSON.parse(t); } catch (e) { throw new Error("not JSON"); }
    } catch (e) { if (!/^HTTP|not JSON/.test(e.message)) DBG.push("FAILED " + b + path + "\n" + e.message); err = e; } }
  throw err; };
const vals = d => Array.isArray(d) ? d : Object.values(d || {});

// Icons: OSRS wiki item images for collection logs (RuneLite's item icon as a backup), and Wise Old Man's own
// skill/boss/activity icons for achievements. If none load, the slot is left empty rather than showing an emoji.
const WIKI = "https://oldschool.runescape.wiki/images/";
const wikiFile = n => WIKI + encodeURIComponent(n.charAt(0).toUpperCase() + n.slice(1).replace(/ /g,"_")) + ".png";
const metricIcon = m => m ? `https://cdn.jsdelivr.net/gh/wise-old-man/wise-old-man@master/app/public/img/metrics/${m}.png` : null;
const icon = (src, alt) => `<span class="ic">${src ? `<img src="${src}" alt="" loading="lazy" data-alt="${alt||""}">` : ""}</span>`;
document.addEventListener("error", e => { const t = e.target;
  if (t.tagName !== "IMG" || !t.closest(".ic")) return;
  if (t.dataset.alt && !t.dataset.tried) { t.dataset.tried = 1; t.src = t.dataset.alt; } else t.remove(); }, true);

const none = '<div class="row">Nothing yet.</div>';
const plink = n => `<a class="pl" href="player.html?name=${encodeURIComponent(n)}">${esc(n)}</a>`;
const board = (l, val) => l.map((e,i) => `<div class="row"><span class="rank">${i+1}</span><div><b>${plink(e.p)}</b></div><span class="xp">${val(e.x)}</span></div>`).join("") || none;
const num = n => Math.round(n).toLocaleString();
// One renderer per section, so each can fill in as soon as its own data arrives
const SHOW = {
  clogs: l => $("clogs").innerHTML = l.map(c => `<div class="row">${icon(wikiFile(c.i), c.id ? "https://static.runelite.net/cache/item/icon/" + c.id + ".png" : "")}<div><b>${plink(c.p)}</b> received ${esc(c.i)}<small>${ago(c.t)}</small></div></div>`).join("") || none,
  ach: l => $("ach").innerHTML = l.map(a => `<div class="row">${icon(metricIcon(a.m))}<div><b>${plink(a.p)}</b> · ${esc(a.n)}<small>${ago(a.t)}</small></div></div>`).join("") || none,
  top: l => $("top").innerHTML = board(l, x => fmt(x) + " xp"),
  ehp: l => $("ehp").innerHTML = board(l, x => x.toFixed(1) + " EHP"),
  ehb: l => $("ehb").innerHTML = board(l, x => x.toFixed(1) + " EHB"),
  members: n => $("sMembers").textContent = num(n),
  stats: s => { $("sLevel").textContent = num(s.lvl); $("sEhb").textContent = num(s.ehb); $("sXp").textContent = fmt(s.xp); }
};

// Last visit's data, shown instantly while fresh data loads (per-browser only)
const CACHE_KEY = "kingdom-home-v2";
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) {}
const save = (k, v) => { cache[k] = v; try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} };
const shown = {};   // what each section currently displays, to skip re-renders (and re-animation) when nothing changed
const put = (key, v) => { const s = JSON.stringify(v); if (shown[key] !== s) { shown[key] = s; SHOW[key](v); } };
const loading = key => { shown[key] = null; $(key).innerHTML = '<div class="row"><small>Loading…</small></div>'; };

const errs = [];
const need = (l, why) => { if (!l.length) throw new Error(why); return l; };
// ck = cache key; isCurrent says whether the result still belongs on screen (the period may have changed meanwhile)
const job = (key, label, p, ck = key, isCurrent = () => true) => p.then(v => {
    save(ck, v);
    if (isCurrent()) put(key, v);
  }).catch(e => {
    if (!isCurrent()) return;
    if (!cache[ck] && SAMPLE[key]) put(key, SAMPLE[key]);
    errs.push(`${label} (${cache[ck] ? "showing saved" : "showing sample"}): ${e.message}`);
    $("note").textContent = "Couldn't load some live data. " + errs.join(" | ");
  });

// Leaderboards: Daily / Weekly / Monthly, top 5 each
const PERIODS = {day:"Daily", week:"Weekly", month:"Monthly"};
const BOARDS = [["top","Top XP","overall"], ["ehp","Top EHP","ehp"], ["ehb","Top EHB","ehb"]];
let period = "month";
try { const p = localStorage.getItem("kingdom-period"); if (PERIODS[p]) period = p; } catch (e) {}
function loadBoards(){
  const per = period;
  document.querySelectorAll(".per").forEach(s => s.textContent = PERIODS[per]);
  document.querySelectorAll("#period button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === per));
  return BOARDS.map(([key, label, skill]) => {
    const ck = key + ":" + per;
    if (cache[ck]) put(key, cache[ck]); else loading(key);
    // Temple's top list for a skill/metric; "xp" holds hours for ehp/ehb. Temple ignores count, so trim to 5.
    return job(key, `${PERIODS[per]} ${label}`, get("temple", `current_top/${per}.php?skill=${skill}&group=${CONFIG.templeGroup}&count=5`).then(j => {
      const k = Object.keys(j).find(k => k !== "info");
      return need(vals(k ? j[k] : j).filter(x => x && x.xp != null).map(x => ({p:x.nickname||x.player, x:Number(x.xp)})).slice(0, 5), "no gains yet"); }),
      ck, () => period === per);
  });
}
$("period").addEventListener("click", e => { const b = e.target.closest("button");
  if (!b || b.dataset.p === period) return;
  period = b.dataset.p;
  try { localStorage.setItem("kingdom-period", period); } catch (e) {}
  loadBoards(); });

["clogs","ach","members","stats"].forEach(k => { if (cache[k]) put(k, cache[k]); else if ($(k)) loading(k); });

function load(){
  const jobs = [
    job("clogs", "Collection logs", get("temple", `collection-log/group_recent_items.php?group=${CONFIG.templeGroup}&count=8`).then(j =>
      need(vals(j.data).filter(x => x && x.name).map(x => ({p:x.player_name_with_capitalization||x.player, i:x.name, id:x.id, t:(x.date_unix||0)*1000})),
        "no items returned (members need the TempleOSRS plugin synced)"))),
    job("ach", "Achievements", get("wom", `groups/${CONFIG.womGroup}/achievements?limit=8`).then(j =>
      need(vals(j).map(a => ({p:(a.player&&a.player.displayName)||"Unknown", n:a.name, m:a.metric, t:new Date(a.createdAt).getTime()})), "none returned"))),
    ...loadBoards(),
    job("members", "Members", get("wom", `groups/${CONFIG.womGroup}`).then(j => { if (!j.memberCount) throw new Error("no member count"); return j.memberCount; })),
    job("stats", "Clan stats", get("wom", `groups/${CONFIG.womGroup}/statistics`).then(j => {
      const d = j.averageStats && j.averageStats.data;
      if (!d) throw new Error("no averages");
      return {lvl:d.skills.overall.level, xp:d.skills.overall.experience, ehb:d.computed.ehb.value}; }))
  ];
  Promise.allSettled(jobs).then(() => {
    if (/debug/.test(location.search)) { const pre = document.createElement("pre");
      pre.style.cssText = "white-space:pre-wrap;word-break:break-all;background:#000;color:#9f9;padding:12px;margin:16px;font-size:12px;border:1px solid #333";
      pre.textContent = DBG.join("\n\n----\n\n"); document.body.appendChild(pre); } });
}
load();
</script>
</body>
</html>
