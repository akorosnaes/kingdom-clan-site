<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom | OSRS Clan</title>
<style>
:root{--bg:#080808;--panel:#121212;--panel2:#1c1c1c;--line:#2a2a2a;--ink:#fff;--mute:#a0a0a0;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
nav{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 12px;border-bottom:1px solid var(--line)}
nav a{color:var(--mute);text-decoration:none;padding:7px 16px;font-size:14px;font-weight:500;border-radius:8px}
nav a.on,nav a:hover{color:#fff;background:var(--panel2)}
.hero{text-align:center;padding:80px 20px 64px;}
.logo{display:block;width:min(520px,86%);height:auto;margin:0 auto 22px}
.navlogo{height:22px;width:auto;display:block;margin-right:10px}
.hero h1{margin:0;position:absolute;left:-9999px;font-size:clamp(32px,6vw,52px);font-weight:700;letter-spacing:-.02em}
.hero p{margin:0 auto 12px;max-width:480px;color:var(--mute);font-size:17px}
.hero .tag{color:#fff;font-weight:700;font-size:20px;letter-spacing:.04em;margin-bottom:6px}
.hero .req{font-size:14px;margin-bottom:18px}
.hero .req a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.members{display:inline-block;margin-bottom:24px;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.btn{display:block;width:max-content;margin:0 auto;background:#5865F2;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:11px 26px;border-radius:9px;transition:background .15s,transform .15s}
.btn:hover{background:#4752C4;transform:translateY(-1px)}
main{max-width:1000px;margin:0 auto;padding:8px 16px 56px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h2{margin:0;padding:16px 18px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);font-size:16px}
.ic img{max-width:32px;max-height:32px;display:block}
.row div{flex:1;min-width:0}
.row b{font-weight:600}
.row small{display:block;color:var(--mute);font-size:13px}
.xp{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.rank{flex:none;width:24px;color:var(--mute);font-weight:600}
.note{margin-top:8px;color:var(--mute);font-size:12px;text-align:center}
footer{text-align:center;padding:24px;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
nav,.hero,main,footer{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.members{animation:rise .8s .25s cubic-bezier(.2,.7,.2,1) both}
.btn{animation:rise .8s .4s cubic-bezier(.2,.7,.2,1) both}
.card{animation:rise .7s .5s cubic-bezier(.2,.7,.2,1) both;transition:border-color .25s}
.grid .card:nth-child(2){animation-delay:.62s}
main>.card{animation-delay:.74s}
.card:hover{border-color:#444}
.row{animation:rise .45s ease both;transition:background .15s}
.row:hover{background:var(--panel2)}
.row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.1s}.row:nth-child(4){animation-delay:.15s}.row:nth-child(5){animation-delay:.2s}
.row:nth-child(6){animation-delay:.25s}.row:nth-child(7){animation-delay:.3s}.row:nth-child(8){animation-delay:.35s}.row:nth-child(9){animation-delay:.4s}.row:nth-child(10){animation-delay:.45s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(0)+"K" : String(n);

const get = async (svc, path) => { let err;
  for (const b of BASES[svc]) {
    try { const r = await fetch(b + path); const t = await r.text();
      DBG.push((r.ok ? "OK " : "HTTP " + r.status + " ") + b + path + "\n" + t.slice(0, 700));
      if (!r.ok) throw new Error("HTTP " + r.status);
      try { return JSON.parse(t); } catch (e) { throw new Error("not JSON"); }
    } catch (e) { if (!/^HTTP|not JSON/.test(e.message)) DBG.push("FAILED " + b + path + "\n" + e.message); err = e; } }
  throw err; };
const vals = d => Array.isArray(d) ? d : Object.values(d || {});

const WIKI = "https://oldschool.runescape.wiki/images/";
const wikiFile = n => WIKI + encodeURIComponent(n.charAt(0).toUpperCase() + n.slice(1).replace(/ /g,"_")) + ".png";
const SKILLS = ["attack","defence","strength","hitpoints","ranged","prayer","magic","cooking","woodcutting","fletching","fishing","firemaking","crafting","smithing","mining","herblore","agility","thieving","slayer","farming","runecrafting","hunter","construction","sailing"];
const title = m => m.split("_").map((w,i) => (i && ["of","the","and"].includes(w)) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
const achSrc = m => !m ? null : SKILLS.includes(m) ? wikiFile(title(m)+" icon") : m === "overall" ? wikiFile("Stats icon") : wikiFile(title(m)+" chathead");
const icon = (src, fb, alt) => `<span class="ic">${src ? `<img src="${src}" alt="" loading="lazy" data-alt="${alt||""}" data-fb="${fb}">` : fb}</span>`;
document.addEventListener("error", e => { const t = e.target;
  if (t.tagName !== "IMG" || !t.dataset.fb) return;
  if (t.dataset.alt && !t.dataset.tried) { t.dataset.tried = 1; t.src = t.dataset.alt; } else t.replaceWith(t.dataset.fb); }, true);

function render(d){
  $("clogs").innerHTML = d.clogs.map(c => `<div class="row">${icon(wikiFile(c.i), "📜", c.id ? "https://static.runelite.net/cache/item/icon/" + c.id + ".png" : "")}<div><b>${esc(c.p)}</b> received ${esc(c.i)}<small>${ago(c.t)}</small></div></div>`).join("") || '<div class="row">Nothing yet.</div>';
  $("ach").innerHTML = d.ach.map(a => `<div class="row">${icon(achSrc(a.m), SKILLS.includes(a.m) || a.m === "overall" ? "🏆" : "💀")}<div><b>${esc(a.p)}</b> · ${esc(a.n)}<small>${ago(a.t)}</small></div></div>`).join("") || '<div class="row">Nothing yet.</div>';
  $("top").innerHTML = d.top.map((e,i) => `<div class="row"><span class="rank">${i+1}</span><div><b>${esc(e.p)}</b></div><span class="xp">${fmt(e.x)} xp</span></div>`).join("") || '<div class="row">Nothing yet.</div>';
  $("members").textContent = d.members ? d.members + " members" : "Members";
}

async function load(){
  const out = JSON.parse(JSON.stringify(SAMPLE)); const errs = []; let live = 0;
  const job = (label, p) => p.catch(e => { errs.push(label + ": " + e.message); });
  const jobs = [
    job("Collection logs", get("temple", `collection-log/group_recent_items.php?group=${CONFIG.templeGroup}&count=8&onlynotable=1`).then(j => {
      const l = vals(j.data).filter(x => x && x.name).map(x => ({p:x.player_name_with_capitalization||x.player, i:x.name, id:x.id, t:(x.date_unix||0)*1000}));
      if (l.length) { out.clogs = l; live++; } else errs.push("Collection logs: no items returned (members need the TempleOSRS plugin synced)"); })),
    job("Achievements", get("wom", `groups/${CONFIG.womGroup}/achievements?limit=8`).then(j => {
      const l = vals(j).map(a => ({p:(a.player&&a.player.displayName)||"Unknown", n:a.name, m:a.metric, t:new Date(a.createdAt).getTime()}));
      if (l.length) { out.ach = l; live++; } else errs.push("Achievements: none returned"); })),
    job("Top earners", get("temple", `current_top/month.php?skill=overall&group=${CONFIG.templeGroup}&count=10`).then(j => {
      const k = Object.keys(j).find(k => k.toLowerCase() === "month");
      const l = vals(k ? j[k] : j).filter(x => x && x.xp != null).map(x => ({p:x.nickname||x.player, x:Number(x.xp)}));
      if (l.length) { out.top = l; live++; } else errs.push("Top earners: unexpected response"); })),
    job("Members", get("wom", `groups/${CONFIG.womGroup}`).then(j => { if (j.memberCount) out.members = j.memberCount; }))
  ];
  await Promise.allSettled(jobs);
  render(out);
  if (/debug/.test(location.search)) { const pre = document.createElement("pre");
    pre.style.cssText = "white-space:pre-wrap;word-break:break-all;background:#000;color:#9f9;padding:12px;margin:16px;font-size:12px;border:1px solid #333";
    pre.textContent = DBG.join("\n\n----\n\n"); document.body.appendChild(pre); }
  $("note").textContent = errs.length ? "Sample data shown where live data failed. " + errs.join(" | ") : "";
}
['clogs','ach','top'].forEach(i => $(i).innerHTML = '<div class="row"><small>Loading…</small></div>');
load();
// Slow drifting dust motes in the background
(function(){
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let w, h, dpr, P = [];
  const rnd = (a,b) => a + Math.random()*(b-a);
  function size(){ dpr = Math.min(devicePixelRatio||1, 2); w = innerWidth; h = innerHeight;
    cv.width = w*dpr; cv.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(70, w/22)); while (P.length < n) P.push(mk(true)); P.length = n; }
  function mk(any){ return {x:rnd(0,w), y:any?rnd(0,h):h+10, r:rnd(.6,1.8), v:rnd(.08,.28), a:rnd(.12,.45), ph:rnd(0,6.28), sw:rnd(.15,.5)}; }
  let t = 0;
  function frame(){
    if (!document.hidden) { t += .01; ctx.clearRect(0,0,w,h);
      for (const p of P) { p.y -= p.v; p.x += Math.sin(t*p.sw + p.ph)*.18;
        if (p.y < -10) Object.assign(p, mk(false));
        ctx.globalAlpha = p.a * (0.6 + 0.4*Math.sin(t*p.sw*3 + p.ph)); ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); } }
    requestAnimationFrame(frame); }
  size(); addEventListener("resize", size); frame();
})();
</script>
