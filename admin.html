<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff console | Kingdom</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--panel:#121212;--panel2:#1c1c1c;--line:#232323;--line2:#333;--ink:#fff;--mute:#9a9a9a;--dim:#5f5f5f;
--sans:Geist,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}

/* Nav */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:2px;padding:12px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
nav a{color:var(--mute);text-decoration:none;padding:6px 14px;font-size:14px;font-weight:500;border-radius:6px;transition:color .15s}
nav a:hover{color:#fff}
nav a.on{color:#fff;background:var(--panel2)}
nav a.navbtn{margin-left:10px;background:#5865F2;color:#fff;font-weight:600;white-space:nowrap}
nav a.navbtn:hover{background:#4752C4}
.navsoc{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
nav .navsoc a{display:grid;place-items:center;padding:7px}
.navsoc svg,.fsoc svg{width:18px;height:18px;display:block}
.navsoc img,.fsoc img{height:18px;width:auto;display:block;opacity:.75;transition:opacity .15s}
.navsoc a:hover img,.fsoc a:hover img{opacity:1}
.fsoc{display:none}
footer a.staff{color:inherit;text-decoration:none}
footer a.staff:hover{color:#fff}
.fsoc a{display:grid;place-items:center;padding:8px;color:var(--mute)}
@media(max-width:960px){.navsoc{position:static;transform:none;margin-left:8px}}
@media(max-width:760px){nav .navlogo{display:none}nav a{white-space:nowrap}}
.navlogo{height:22px;width:auto;display:block;margin-right:12px}
@media(max-width:600px){nav{gap:0;padding:10px 4px;justify-content:safe center;overflow-x:auto}nav a{padding:6px 7px;font-size:13px;white-space:nowrap}nav .navlogo,nav .long,.navsoc{display:none}.fsoc{display:flex;justify-content:center;gap:8px;margin:-12px 0 14px}nav a.navbtn{margin-left:4px}}

/* Page title */
.phero{max-width:1080px;margin:0 auto;padding:64px 20px 0}
.phero h1{margin:0;font:600 clamp(36px,6vw,56px)/1.05 var(--sans);letter-spacing:-.04em}
.phero p{margin:14px 0 0;font:500 12px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
main{max-width:1080px;margin:0 auto;padding:8px 20px 72px}

/* Section headers, labels, shared bits */
.sec{margin-top:56px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.sech h2{margin:0;font:600 clamp(22px,3vw,28px)/1.1 var(--sans);letter-spacing:-.03em}
.sech small{font:500 12px/1 var(--mono);color:var(--mute);letter-spacing:.06em}
.mlab{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.rk{flex:none;display:inline-grid;place-items:center;min-width:22px;font:500 13px/1 var(--mono);color:var(--dim)}
.rk.m1{color:#fff}
.msg{padding:28px 0;color:var(--mute);font-size:14px}
.ghost{background:none;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:8px 16px;font:500 13px/1.2 var(--sans);cursor:pointer;transition:border-color .15s}
.ghost:hover{border-color:#fff}

footer{text-align:center;padding:28px 20px;color:var(--dim);font:12px/1 var(--mono);letter-spacing:.04em;border-top:1px solid var(--line)}

/* One quiet entrance for the page */
@keyframes fade{from{opacity:0}to{opacity:1}}
.phero,main{animation:fade .6s ease both}
main{animation-delay:.1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Staff console */
.who{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:14px;color:var(--mute)}
.who img{width:24px;height:24px;border-radius:50%}
.who a{color:#fff}
.gate{max-width:460px;padding-top:40px}
.gate p{margin:0 0 24px;color:var(--mute)}
.gate p.err{color:#fff;border-left:2px solid #fff;padding-left:14px}
.dbtn{display:inline-flex;align-items:center;gap:10px;background:#5865F2;color:#fff;text-decoration:none;border-radius:6px;padding:11px 20px;font:600 14px/1.2 var(--sans);transition:background .15s}
.dbtn:hover{background:#4752C4}
.dbtn svg{width:20px;height:20px}
.up{display:grid;grid-template-columns:200px 1fr auto;gap:16px;align-items:end;padding:24px 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){.up{grid-template-columns:1fr}}
.up label{display:grid;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.up input[type=month]{background:none;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:9px 12px;font:14px/1.3 var(--sans);color-scheme:dark}
.drop{position:relative;cursor:pointer}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop span{display:block;border:1px dashed var(--line2);border-radius:6px;padding:10px 12px;font:14px/1.3 var(--sans);letter-spacing:0;text-transform:none;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s}
.drop:hover span,.drop.over span{border-color:#fff;color:#fff}
.primary{background:#fff;color:#000;border:0;border-radius:6px;padding:11px 22px;font:600 14px/1.2 var(--sans);cursor:pointer}
.primary:hover{background:#ddd}
.primary:disabled{opacity:.5;cursor:default}
.preview{grid-column:1/-1;max-width:420px;border:1px solid var(--line);border-radius:6px}
.upmsg{grid-column:1/-1;margin:0;font-size:14px;color:var(--mute)}
.upmsg.bad{color:#fff}
.crow{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.crow img{flex:none;width:160px;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#0d0d0d}
.crow div{flex:1;min-width:0}
.crow b{font-size:16px;font-weight:600}
.crow small{display:block;margin-top:4px;font:12px/1.4 var(--mono);color:var(--dim)}
.tag{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid var(--line2);border-radius:4px;font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);vertical-align:2px}
.tag.now{border-color:#fff;color:#fff}
.acts{display:flex;gap:8px;flex:none}
.acts a,.acts button{background:none;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:7px 12px;font:500 13px/1.2 var(--sans);text-decoration:none;cursor:pointer;transition:border-color .15s}
.acts a:hover,.acts button:hover{border-color:#fff}
@media(max-width:600px){.crow{flex-wrap:wrap}.crow img{width:100%}.acts{width:100%}}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label = m => new Date(m + "-01T12:00:00").toLocaleDateString(undefined, {month:"long", year:"numeric"});
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const thisMonth = ymd(new Date());
const ago = t => { const m = Math.max(1, Math.round((Date.now() - t) / 6e4));
  return m < 60 ? m + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };
const ERRORS = {
  setup: "The staff console isn't set up yet: the Discord login settings still need adding in Netlify.",
  denied: "That Discord account isn't on the staff list. Ask an admin to add your Discord user ID.",
  cancelled: "Login cancelled.",
  expired: "That login took too long or was started elsewhere. Try again.",
  discord: "Discord didn't respond properly. Try again in a moment."
};
let calendars = [];

const api = async (path, opts = {}) => {
  const r = await fetch(path, { credentials: "same-origin", cache: "no-store", ...opts });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(body.error || "HTTP " + r.status); e.status = r.status; throw e; }
  return body;
};

function showList(){
  $("list").innerHTML = calendars.map(c => {
    const tag = c.month === thisMonth ? '<span class="tag now">Live now</span>' : c.month > thisMonth ? '<span class="tag">Upcoming</span>' : "";
    return `<div class="crow"><img src="${esc(c.url)}" alt="" loading="lazy"><div><b>${label(c.month)}</b>${tag}
      <small>Uploaded ${ago(c.updated)}${c.by ? " by " + esc(c.by) : ""}${c.size ? " · " + Math.round(c.size / 1024) + " KB" : ""}</small></div>
      <div class="acts"><a href="${esc(c.url)}" target="_blank" rel="noopener">View</a><button type="button" data-del="${c.month}">Remove</button></div></div>`; }).join("")
    || '<div class="msg">No calendars yet. Upload this month\'s above.</div>';
}

// Big exports get re-encoded as WebP in the browser so they fit the 5 MB upload limit
async function shrink(file){
  if (file.size <= 4.5 * 1024 * 1024) return file;
  const img = await createImageBitmap(file), c = document.createElement("canvas");
  const s = Math.min(1, 2400 / img.width); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, "image/webp", 0.9));
  return new File([blob], file.name.replace(/\.\w+$/, "") + ".webp", { type: "image/webp" });
}

function pick(file){
  if (!file) return;
  $("droptext").textContent = file.name;
  $("preview").src = URL.createObjectURL(file); $("preview").hidden = false;
  $("upmsg").textContent = ""; $("upmsg").className = "upmsg";
}
$("file").addEventListener("change", e => pick(e.target.files[0]));
["dragenter", "dragover"].forEach(t => $("drop").addEventListener(t, () => $("drop").classList.add("over")));
["dragleave", "drop"].forEach(t => $("drop").addEventListener(t, () => $("drop").classList.remove("over")));

$("up").addEventListener("submit", async e => {
  e.preventDefault();
  const month = $("month").value, file = $("file").files[0], msg = $("upmsg");
  if (!month || !file) return;
  if (calendars.some(c => c.month === month) && !confirm(`Replace the ${label(month)} calendar?`)) return;
  $("upbtn").disabled = true; msg.className = "upmsg"; msg.textContent = "Uploading…";
  try {
    const fd = new FormData(); fd.append("month", month); fd.append("file", await shrink(file));
    calendars = await api("/api/calendars", { method: "POST", body: fd });
    showList();
    msg.textContent = `${label(month)} is live on the Events page.`;
    $("up").reset(); $("preview").hidden = true; $("droptext").textContent = "Choose or drop a PNG, JPG or WebP"; setDefaultMonth();
  } catch (err) {
    msg.className = "upmsg bad"; msg.textContent = err.status === 401 ? "Your login expired. Refresh the page and log in again." : err.message;
  }
  $("upbtn").disabled = false;
});

$("list").addEventListener("click", async e => {
  const m = e.target.dataset.del; if (!m || !confirm(`Remove the ${label(m)} calendar? This can't be undone.`)) return;
  e.target.disabled = true;
  try { calendars = await api("/api/calendars?month=" + m, { method: "DELETE" }); showList(); }
  catch (err) { alert(err.message); e.target.disabled = false; }
});

// Default to next month, or this month if it has no calendar yet
function setDefaultMonth(){
  const n = new Date(); n.setDate(1); n.setMonth(n.getMonth() + 1);
  $("month").value = calendars.some(c => c.month === thisMonth) ? ymd(n) : thisMonth;
}

async function start(){
  const err = new URLSearchParams(location.search).get("error");
  try {
    const me = await api("/api/me");
    $("who").innerHTML = (me.avatar ? `<img src="https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=48" alt="">` : "")
      + `Logged in as <b>${esc(me.name)}</b> · <a href="/auth/logout">Log out</a>`;
    $("who").hidden = false; $("console").hidden = false;
    calendars = await api("/api/calendars?staff=1");
    showList(); setDefaultMonth();
  } catch (e) {
    $("gate").hidden = false;
    const why = e.status === 503 ? "setup" : err;
    if (ERRORS[why]) { $("gatemsg").textContent = ERRORS[why]; $("gatemsg").className = "err"; }
    else if (new URLSearchParams(location.search).has("loggedout")) $("gatemsg").textContent = "You're logged out.";
  }
}
start();
</script>
</body>
</html>
