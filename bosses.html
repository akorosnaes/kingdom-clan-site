<style>
:root{--bg:#080808;--panel:#121212;--panel2:#1c1c1c;--line:#232323;--line2:#333;--ink:#fff;--mute:#9a9a9a;--dim:#5f5f5f;
--sans:Geist,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}

/* Nav */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:2px;padding:12px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
nav a{color:var(--mute);text-decoration:none;padding:6px 14px;font-size:14px;font-weight:500;border-radius:6px;transition:color .15s}
nav a:hover{color:#fff}
nav a.on{color:#fff;background:var(--panel2)}
nav a.navbtn{margin-left:10px;background:#5865F2;color:#fff;font-weight:600;white-space:nowrap}
nav a.navbtn:hover{background:#4752C4}
.navsoc{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
nav .navsoc a{display:grid;place-items:center;padding:7px}
.navsoc svg,.fsoc svg{width:18px;height:18px;display:block}
.navsoc img,.fsoc img{height:18px;width:auto;display:block;opacity:.75;transition:opacity .15s}
.navsoc a:hover img,.fsoc a:hover img{opacity:1}
.fsoc{display:none}
footer a.staff{color:inherit;text-decoration:none}
footer a.staff:hover{color:#fff}
.fsoc a{display:grid;place-items:center;padding:8px;color:var(--mute)}
@media(max-width:1120px){nav{justify-content:safe center;overflow-x:auto;scrollbar-width:none}.navsoc{position:static;transform:none;margin-left:8px}}
@media(max-width:760px){nav{justify-content:safe center;overflow-x:auto;scrollbar-width:none}nav .navlogo,nav .long{display:none}nav a{white-space:nowrap;padding:6px 10px}}
.navlogo{height:22px;width:auto;display:block;margin-right:12px}
@media(max-width:600px){nav{gap:0;padding:10px 4px;justify-content:safe center;overflow-x:auto}nav a{padding:6px 7px;font-size:13px;white-space:nowrap}nav .navlogo,nav .long,.navsoc{display:none}.fsoc{display:flex;justify-content:center;gap:8px;margin:-12px 0 14px}nav a.navbtn{margin-left:4px}}

/* Page title */
.phero{max-width:1080px;margin:0 auto;padding:64px 20px 0}
.phero h1{margin:0;font:600 clamp(36px,6vw,56px)/1.05 var(--sans);letter-spacing:-.04em}
.phero p{margin:14px 0 0;font:500 12px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
main{max-width:1080px;margin:0 auto;padding:8px 20px 72px}

/* Section headers, labels, shared bits */
.sec{margin-top:56px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.sech h2{margin:0;font:600 clamp(22px,3vw,28px)/1.1 var(--sans);letter-spacing:-.03em}
.sech small{font:500 12px/1 var(--mono);color:var(--mute);letter-spacing:.06em}
.mlab{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.rk{flex:none;display:inline-grid;place-items:center;min-width:22px;font:500 13px/1 var(--mono);color:var(--dim)}
.rk.m1{color:#fff}
.msg{padding:28px 0;color:var(--mute);font-size:14px}
.ghost{background:none;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:8px 16px;font:500 13px/1.2 var(--sans);cursor:pointer;transition:border-color .15s}
.ghost:hover{border-color:#fff}

footer{text-align:center;padding:28px 20px;color:var(--dim);font:12px/1 var(--mono);letter-spacing:.04em;border-top:1px solid var(--line)}

/* One quiet entrance for the page */
@keyframes fade{from{opacity:0}to{opacity:1}}
.phero,main{animation:fade .6s ease both}
main{animation-delay:.1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Boss picker */
.layout{display:grid;grid-template-columns:240px 1fr;gap:48px;align-items:start;margin-top:48px}
.side{position:sticky;top:76px}
.side .search{display:block;width:100%;background:none;border:1px solid var(--line2);color:#fff;border-radius:6px;padding:8px 12px;font:14px/1.3 var(--sans)}
.side .search::placeholder{color:var(--dim)}
.side .search:focus{outline:none;border-color:#fff}
.blist{max-height:calc(100vh - 150px);overflow-y:auto;margin-top:10px;padding-right:4px;scrollbar-width:thin}
.bb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:6px;padding:6px 8px;color:var(--mute);font:500 14px/1.3 var(--sans);text-align:left;cursor:pointer;transition:color .15s}
.bb:hover{color:#fff}
.bb[aria-current="true"]{background:#fff;color:#000;font-weight:600}
.bb img{flex:none;width:22px;height:22px;object-fit:contain;image-rendering:pixelated}
.nomatch{padding:10px 8px;color:var(--mute);font-size:13px}
@media(max-width:760px){.layout{grid-template-columns:1fr;gap:28px}.side{position:static}.blist{max-height:250px;border-bottom:1px solid var(--line)}}

/* Leaderboard */
.bh{display:flex;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line2)}
.bh .bi{flex:none;width:48px;height:48px;display:grid;place-items:center}
.bh .bi img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
.bh h2{margin:0;font:600 clamp(24px,3.4vw,32px)/1.1 var(--sans);letter-spacing:-.03em}
.bh small{display:block;margin-top:6px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:20px 16px 18px;min-width:0}
.stats div:first-child{padding-left:0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font:500 clamp(22px,3vw,30px)/1 var(--mono);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats small{display:block;margin-top:10px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{padding-top:18px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td:nth-child(2){font-family:var(--sans)}
tbody tr:hover td{background:#0f0f0f}
td a{color:#fff;text-decoration:none;font-weight:600}
td a:hover{text-decoration:underline;text-underline-offset:4px}
td.k{color:#fff}
td.g{color:var(--dim)}
.msg{text-align:left}
.more{display:block;margin:20px auto 0;background:none;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:9px 18px;font:500 13px/1.2 var(--sans);cursor:pointer;transition:border-color .15s}
.more:hover{border-color:#fff}
@media(max-width:600px){th,td{padding:10px 8px}.stats div{padding:14px 10px}th.g,td.g{display:none}}
/* Faint film grain over the whole page, so the flat black has some depth. Still, never in the way of clicks. */
body::after{content:"";position:fixed;inset:0;z-index:100;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'180'%20height%3D'180'%3E%3Cfilter%20id%3D'n'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.85'%20numOctaves%3D'3'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20type%3D'saturate'%20values%3D'0'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'100%25'%20height%3D'100%25'%20filter%3D'url(%23n)'%2F%3E%3C%2Fsvg%3E") 0 0/180px}
</style>

<script>if(/(^|;\s*)kd_staff=1/.test(document.cookie))document.querySelectorAll(".staffnav").forEach(a=>a.hidden=false)</script>
<header class="phero">
  <h1>Boss leaderboards</h1>
  <p>Clan kill counts for every boss</p>

<main>
  <div class="layout">
    <aside class="side">
      <input class="search" id="q" type="search" placeholder="Search bosses…" aria-label="Search bosses" autocomplete="off">

<script>
// ---- EDIT THESE ----
const CONFIG = { womGroup: 1152, defaultBoss: "vorkath", perPage: 25 };
// --------------------

// Every boss Wise Old Man tracks (its metric names). Names that don't title-case nicely are spelled out in NAMES.
const BOSSES = ["abyssal_sire","alchemical_hydra","amoxliatl","araxxor","artio","barrows_chests","brutus","bryophyta","callisto","calvarion","cerberus","chambers_of_xeric","chambers_of_xeric_challenge_mode","chaos_elemental","chaos_fanatic","commander_zilyana","corporeal_beast","crazy_archaeologist","dagannoth_prime","dagannoth_rex","dagannoth_supreme","deranged_archaeologist","doom_of_mokhaiotl","duke_sucellus","general_graardor","giant_mole","grotesque_guardians","hespori","kalphite_queen","king_black_dragon","kraken","kreearra","kril_tsutsaroth","lunar_chests","mad_angel","maggot_king","mimic","nex","nightmare","phosanis_nightmare","obor","phantom_muspah","sarachnis","scorpia","scurrius","shellbane_gryphon","skotizo","sol_heredit","spindel","tempoross","the_gauntlet","the_corrupted_gauntlet","the_fractured_archive","the_hueycoatl","the_leviathan","the_royal_titans","the_whisperer","theatre_of_blood","theatre_of_blood_hard_mode","thermonuclear_smoke_devil","tombs_of_amascut","tombs_of_amascut_expert","tzkal_zuk","tztok_jad","vardorvis","venenatis","vetion","vorkath","wintertodt","yama","zalcano","zulrah"];
const NAMES = {
  chambers_of_xeric_challenge_mode: "Chambers of Xeric (CM)", theatre_of_blood_hard_mode: "Theatre of Blood (HM)",
  tombs_of_amascut_expert: "Tombs of Amascut (Expert)", kreearra: "Kree'arra", kril_tsutsaroth: "K'ril Tsutsaroth",
  vetion: "Vet'ion", tzkal_zuk: "TzKal-Zuk", tztok_jad: "TzTok-Jad", nightmare: "The Nightmare",
  phosanis_nightmare: "Phosani's Nightmare", mimic: "The Mimic"
};
// Common shorthand people search for
const ALIASES = {
  tombs_of_amascut: "toa", tombs_of_amascut_expert: "toa expert", chambers_of_xeric: "cox raids", chambers_of_xeric_challenge_mode: "cox cm raids",
  theatre_of_blood: "tob raids", theatre_of_blood_hard_mode: "tob hmt hm raids", the_corrupted_gauntlet: "cg", the_gauntlet: "gauntlet",
  kalphite_queen: "kq", king_black_dragon: "kbd", tzkal_zuk: "zuk inferno", tztok_jad: "jad fight caves", sol_heredit: "colosseum",
  corporeal_beast: "corp", general_graardor: "bandos gwd", commander_zilyana: "sara zily gwd", kril_tsutsaroth: "zammy kril gwd",
  kreearra: "arma gwd", nex: "gwd", thermonuclear_smoke_devil: "thermy", nightmare: "nm", phosanis_nightmare: "pnm",
  alchemical_hydra: "hydra", abyssal_sire: "sire", grotesque_guardians: "ggs gargs", phantom_muspah: "muspah",
  duke_sucellus: "dt2", the_leviathan: "dt2 levi", the_whisperer: "dt2", vardorvis: "dt2", the_royal_titans: "titans",
  doom_of_mokhaiotl: "doom", the_hueycoatl: "huey", cerberus: "cerb", dagannoth_prime: "dks", dagannoth_rex: "dks", dagannoth_supreme: "dks"
};
const title = k => NAMES[k] || k.split("_").map((w,i) => (i && ["of","the","and"].includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
const icon = k => `https://cdn.jsdelivr.net/gh/wise-old-man/wise-old-man@master/app/public/img/metrics/${k}.png`;
const LIST = BOSSES.map(k => ({k, name: title(k), find: (title(k) + " " + (ALIASES[k] || "")).toLowerCase()})).sort((a, b) => a.name.replace(/^The /, "").localeCompare(b.name.replace(/^The /, "")));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => Math.round(n).toLocaleString();
// WOM allows CORS, so call it directly first: its rate limit is then per visitor, not shared through the proxy
const BASES = ["https://api.wiseoldman.net/v2/", "/api/wom/"];
const get = async path => { let err;
  for (const b of BASES) {
    try { const r = await fetch(b + path); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
    catch (e) { if (e.message === "HTTP 429") throw e; err = e; } }
  throw err; };

// Per-browser cache of each boss's leaderboard: shown instantly, refreshed when older than 10 minutes
const CACHE_KEY = "kingdom-bosses-v1", FRESH = 10 * 60e3;
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) {}
const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} };

// ---- Boss list ----
let current = null;
function renderList(){
  const q = $("q").value.trim().toLowerCase();
  const l = LIST.filter(b => !q || b.find.includes(q));
  $("blist").innerHTML = l.map(b => `<button class="bb" type="button" role="listitem" data-k="${b.k}"${b.k === current ? ' aria-current="true"' : ""}><img src="${icon(b.k)}" alt="" loading="lazy">${esc(b.name)}</button>`).join("")
    || '<div class="nomatch">No bosses match.</div>';
}
$("q").addEventListener("input", renderList);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("blist").querySelector(".bb"); if (b) b.click(); } });
$("blist").addEventListener("click", e => { const b = e.target.closest(".bb"); if (b) pick(b.dataset.k, true); });

// ---- Leaderboard ----
let shown = 0;
function head(k, sub){
  return `<div class="bh"><span class="bi"><img src="${icon(k)}" alt=""></span><div><h2>${esc(title(k))}</h2><small>${sub}</small></div></div>`;
}
function renderBoard(k, rows){
  if (!rows.length) { $("board").innerHTML = head(k, "Clan leaderboard") + '<div class="msg">Nobody in the clan has a tracked kill count here yet.</div>'; return; }
  const total = rows.reduce((s, r) => s + r[1], 0);
  $("board").innerHTML = head(k, "Clan leaderboard") +
    `<div class="stats"><div><b>${rows.length}</b><small>Members with kills</small></div><div><b>${num(total)}</b><small>Total clan kills</small></div><div><b>${esc(rows[0][0])}</b><small>Top killer</small></div></div>
    <table><thead><tr><th>#</th><th>Player</th><th>Kills</th><th class="g">OSRS rank</th></tr></thead><tbody id="rows"></tbody></table>
    <button class="more" id="more" type="button" hidden></button>`;
  shown = 0; more(rows);
  $("more").onclick = () => more(rows);
}
function more(rows){
  const next = rows.slice(shown, shown + CONFIG.perPage);
  $("rows").insertAdjacentHTML("beforeend", next.map((r, i) => { const n = shown + i;
    return `<tr><td><span class="rk${n < 3 ? " m" + (n + 1) : ""}">${n + 1}</span></td><td><a href="player.html?name=${encodeURIComponent(r[0])}">${esc(r[0])}</a></td><td class="k">${num(r[1])}</td><td class="g">${r[2] > 0 ? num(r[2]) : "—"}</td></tr>`; }).join(""));
  shown += next.length;
  const left = rows.length - shown;
  $("more").hidden = left <= 0;
  $("more").textContent = `Show ${Math.min(left, CONFIG.perPage)} more (${left} left)`;
}

function pick(k, fromClick){
  if (!BOSSES.includes(k)) k = CONFIG.defaultBoss;
  current = k;
  if (location.hash.slice(1) !== k) history.replaceState(null, "", "#" + k);
  renderList();
  const sel = $("blist").querySelector('[aria-current="true"]');
  if (sel && !fromClick) sel.scrollIntoView({block: "nearest"});
  if (fromClick && innerWidth <= 760) $("board").scrollIntoView({behavior: "smooth", block: "start"});
  const c = cache[k];
  if (c) renderBoard(k, c.rows);
  else $("board").innerHTML = head(k, "Loading clan leaderboard…") + '<div class="msg">Loading…</div>';
  if (c && Date.now() - c.t < FRESH) return;
  get(`groups/${CONFIG.womGroup}/hiscores?metric=${k}&limit=500`).then(list => {
    // Keep just [name, kills, OSRS rank] for members with at least one kill
    const rows = list.filter(h => h.data && h.data.kills > 0).map(h => [h.player.displayName, h.data.kills, h.data.rank])
      .sort((a, b) => b[1] - a[1]);
    const changed = !c || JSON.stringify(c.rows) !== JSON.stringify(rows);
    cache[k] = {t: Date.now(), rows}; saveCache();
    if (current === k && changed) renderBoard(k, rows);
  }).catch(e => {
    if (current !== k || c) return;
    $("board").innerHTML = head(k, "Clan leaderboard") + `<div class="msg">Couldn't load this leaderboard from Wise Old Man (${esc(e.message === "HTTP 429" ? "too many requests, try again in a minute" : e.message)}).</div>`;
  });
}
addEventListener("hashchange", () => { const k = location.hash.slice(1); if (k !== current) pick(k); });
pick(location.hash.slice(1) || CONFIG.defaultBoss);
