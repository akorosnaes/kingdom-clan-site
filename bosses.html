<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bosses | Kingdom</title>
<style>
:root{--bg:#080808;--panel:#121212;--panel2:#1c1c1c;--line:#2a2a2a;--ink:#fff;--mute:#a0a0a0;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
nav{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 12px;border-bottom:1px solid var(--line)}
nav a{color:var(--mute);text-decoration:none;padding:7px 16px;font-size:14px;font-weight:500;border-radius:8px}
nav a.on,nav a:hover{color:#fff;background:var(--panel2)}
nav a.navbtn{margin-left:8px;background:#5865F2;color:#fff;font-weight:600;white-space:nowrap}
nav a.navbtn:hover{background:#4752C4}
@media(max-width:600px){nav{gap:0;padding:10px 4px;justify-content:safe center;overflow-x:auto}nav a{padding:6px 7px;font-size:13px;white-space:nowrap}nav .navlogo,nav .long{display:none}nav a.navbtn{margin-left:4px}}
.hero{text-align:center;padding:48px 20px 28px}
.logo{display:block;width:min(360px,80%);height:auto;margin:0 auto 14px}
.navlogo{height:22px;width:auto;display:block;margin-right:10px}
.hero .tag{margin:0 auto 6px;color:#fff;font-weight:700;font-size:20px;letter-spacing:.04em}
main{max-width:1000px;margin:0 auto;padding:8px 16px 56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
footer{text-align:center;padding:24px;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}

.layout{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:72px}
.side .search{display:block;width:calc(100% - 24px);margin:12px;background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:8px;padding:9px 12px;font:inherit;font-size:14px}
.side .search:focus{outline:none;border-color:#555}
.blist{max-height:calc(100vh - 170px);overflow-y:auto;padding:0 6px 8px;scrollbar-width:thin}
.bb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;padding:6px 8px;color:var(--mute);font:500 14px/1.3 inherit;font-family:inherit;text-align:left;cursor:pointer}
.bb:hover{background:var(--panel2);color:#fff}
.bb[aria-current="true"]{background:#fff;color:#000;font-weight:600}
.bb img{flex:none;width:22px;height:22px;object-fit:contain;image-rendering:pixelated}
.nomatch{padding:10px 12px;color:var(--mute);font-size:13px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static}.blist{max-height:260px}}

.bh{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid var(--line)}
.bh .bi{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--panel2)}
.bh .bi img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
.bh h2{margin:0;font-size:19px;font-weight:700;line-height:1.25}
.bh small{color:var(--mute);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:12px 18px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats small{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 18px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border:0}
td a{color:#fff;text-decoration:none;font-weight:600}
td a:hover{text-decoration:underline;text-underline-offset:3px}
td.k{font-weight:600}
td.g{color:var(--mute)}
.rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;color:var(--mute);background:var(--panel2)}
.rk.m1{background:#f5c542;color:#000}.rk.m2{background:#c9ccd1;color:#000}.rk.m3{background:#cd8a4a;color:#000}
.msg{padding:28px 18px;text-align:center;color:var(--mute)}
.more{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px;color:#fff;font:600 14px/1.2 inherit;font-family:inherit;cursor:pointer}
.more:hover{background:var(--panel2)}
@media(max-width:600px){th,td{padding:9px 10px}.stats div{padding:10px 12px}.stats b{font-size:16px}th.g,td.g{display:none}}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
nav,.hero,main,footer{position:relative;z-index:1}
nav{position:sticky;top:0;z-index:10;background:rgba(8,8,8,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
main{animation:rise .7s .3s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const title = k => NAMES[k] || k.split("_").map((w,i) => (i && ["of","the","and"].includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
const icon = k => `https://cdn.jsdelivr.net/gh/wise-old-man/wise-old-man@master/app/public/img/metrics/${k}.png`;
const LIST = BOSSES.map(k => ({k, name: title(k), find: (title(k) + " " + (ALIASES[k] || "")).toLowerCase()})).sort((a, b) => a.name.replace(/^The /, "").localeCompare(b.name.replace(/^The /, "")));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => Math.round(n).toLocaleString();
// WOM allows CORS, so call it directly first: its rate limit is then per visitor, not shared through the proxy
const BASES = ["https://api.wiseoldman.net/v2/", "/api/wom/"];
const get = async path => { let err;
  for (const b of BASES) {
    try { const r = await fetch(b + path); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
    catch (e) { if (e.message === "HTTP 429") throw e; err = e; } }
  throw err; };

// Per-browser cache of each boss's leaderboard: shown instantly, refreshed when older than 10 minutes
const CACHE_KEY = "kingdom-bosses-v1", FRESH = 10 * 60e3;
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) {}
const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} };

// ---- Boss list ----
let current = null;
function renderList(){
  const q = $("q").value.trim().toLowerCase();
  const l = LIST.filter(b => !q || b.find.includes(q));
  $("blist").innerHTML = l.map(b => `<button class="bb" type="button" role="listitem" data-k="${b.k}"${b.k === current ? ' aria-current="true"' : ""}><img src="${icon(b.k)}" alt="" loading="lazy">${esc(b.name)}</button>`).join("")
    || '<div class="nomatch">No bosses match.</div>';
}
$("q").addEventListener("input", renderList);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("blist").querySelector(".bb"); if (b) b.click(); } });
$("blist").addEventListener("click", e => { const b = e.target.closest(".bb"); if (b) pick(b.dataset.k, true); });

// ---- Leaderboard ----
let shown = 0;
function head(k, sub){
  return `<div class="bh"><span class="bi"><img src="${icon(k)}" alt=""></span><div><h2>${esc(title(k))}</h2><small>${sub}</small></div></div>`;
}
function renderBoard(k, rows){
  if (!rows.length) { $("board").innerHTML = head(k, "Clan leaderboard") + '<div class="msg">Nobody in the clan has a tracked kill count here yet.</div>'; return; }
  const total = rows.reduce((s, r) => s + r[1], 0);
  $("board").innerHTML = head(k, "Clan leaderboard · from Wise Old Man") +
    `<div class="stats"><div><b>${rows.length}</b><small>Members with kills</small></div><div><b>${num(total)}</b><small>Total clan kills</small></div><div><b>${esc(rows[0][0])}</b><small>Top killer</small></div></div>
    <table><thead><tr><th>#</th><th>Player</th><th>Kills</th><th class="g">OSRS rank</th></tr></thead><tbody id="rows"></tbody></table>
    <button class="more" id="more" type="button" hidden></button>`;
  shown = 0; more(rows);
  $("more").onclick = () => more(rows);
}
function more(rows){
  const next = rows.slice(shown, shown + CONFIG.perPage);
  $("rows").insertAdjacentHTML("beforeend", next.map((r, i) => { const n = shown + i;
    return `<tr><td><span class="rk${n < 3 ? " m" + (n + 1) : ""}">${n + 1}</span></td><td><a href="https://wiseoldman.net/players/${encodeURIComponent(r[0])}" target="_blank" rel="noopener">${esc(r[0])}</a></td><td class="k">${num(r[1])}</td><td class="g">${r[2] > 0 ? num(r[2]) : "—"}</td></tr>`; }).join(""));
  shown += next.length;
  const left = rows.length - shown;
  $("more").hidden = left <= 0;
  $("more").textContent = `Show ${Math.min(left, CONFIG.perPage)} more (${left} left)`;
}

function pick(k, fromClick){
  if (!BOSSES.includes(k)) k = CONFIG.defaultBoss;
  current = k;
  if (location.hash.slice(1) !== k) history.replaceState(null, "", "#" + k);
  renderList();
  const sel = $("blist").querySelector('[aria-current="true"]');
  if (sel && !fromClick) sel.scrollIntoView({block: "nearest"});
  if (fromClick && innerWidth <= 760) $("board").scrollIntoView({behavior: "smooth", block: "start"});
  const c = cache[k];
  if (c) renderBoard(k, c.rows);
  else $("board").innerHTML = head(k, "Loading clan leaderboard…") + '<div class="msg">Loading…</div>';
  if (c && Date.now() - c.t < FRESH) return;
  get(`groups/${CONFIG.womGroup}/hiscores?metric=${k}&limit=500`).then(list => {
    // Keep just [name, kills, OSRS rank] for members with at least one kill
    const rows = list.filter(h => h.data && h.data.kills > 0).map(h => [h.player.displayName, h.data.kills, h.data.rank])
      .sort((a, b) => b[1] - a[1]);
    const changed = !c || JSON.stringify(c.rows) !== JSON.stringify(rows);
    cache[k] = {t: Date.now(), rows}; saveCache();
    if (current === k && changed) renderBoard(k, rows);
  }).catch(e => {
    if (current !== k || c) return;
    $("board").innerHTML = head(k, "Clan leaderboard") + `<div class="msg">Couldn't load this leaderboard from Wise Old Man (${esc(e.message === "HTTP 429" ? "too many requests, try again in a minute" : e.message)}).</div>`;
  });
}
addEventListener("hashchange", () => { const k = location.hash.slice(1); if (k !== current) pick(k); });
pick(location.hash.slice(1) || CONFIG.defaultBoss);

// Slow drifting dust motes in the background
(function(){
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let w, h, dpr, P = [];
  const rnd = (a,b) => a + Math.random()*(b-a);
  function size(){ dpr = Math.min(devicePixelRatio||1, 2); w = innerWidth; h = innerHeight;
    cv.width = w*dpr; cv.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(70, w/22)); while (P.length < n) P.push(mk(true)); P.length = n; }
  function mk(any){ return {x:rnd(0,w), y:any?rnd(0,h):h+10, r:rnd(.6,1.8), v:rnd(.08,.28), a:rnd(.12,.45), ph:rnd(0,6.28), sw:rnd(.15,.5)}; }
  let t = 0;
  function frame(){
    if (!document.hidden) { t += .01; ctx.clearRect(0,0,w,h);
      for (const p of P) { p.y -= p.v; p.x += Math.sin(t*p.sw + p.ph)*.18;
        if (p.y < -10) Object.assign(p, mk(false));
        ctx.globalAlpha = p.a * (0.6 + 0.4*Math.sin(t*p.sw*3 + p.ph)); ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); } }
    requestAnimationFrame(frame); }
  size(); addEventListener("resize", size); frame();
})();
</script>
</body>
</html>
